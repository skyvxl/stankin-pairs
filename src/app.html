<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

		<!-- PWA / mobile -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Расписание" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />

		<!-- SEO base -->
		<title>СТАНКИН Расписание</title>
		<meta name="description" content="Неофициальное расписание занятий МГТУ СТАНКИН. Быстро, удобно, работает офлайн." />
		<meta name="robots" content="index, follow" />

		<!-- Open Graph (Telegram, VK, Discord, etc.) -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="СТАНКИН Расписание" />
		<meta property="og:description" content="Неофициальное расписание занятий МГТУ СТАНКИН. Быстро, удобно, работает офлайн." />
		<meta property="og:image" content="https://stankin-pairs.vercel.app/pwa-512x512.png" />
		<meta property="og:image:width" content="512" />
		<meta property="og:image:height" content="512" />
		<meta property="og:locale" content="ru_RU" />

		<!-- Twitter / X Card -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="СТАНКИН Расписание" />
		<meta name="twitter:description" content="Неофициальное расписание занятий МГТУ СТАНКИН." />
		<meta name="twitter:image" content="https://stankin-pairs.vercel.app/pwa-512x512.png" />

		<!-- PWA manifest & SW registration -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js', { scope: '/' });
				});
			}
		</script>

		<!-- Icons -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
